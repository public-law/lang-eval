# Add a language by copying a block. Every field except name is optional.
# repos: candidate homes of the main compiler; the most recently active one is treated as canonical.
# forum.kind: "discourse" or "nimforum".
# packages.kind: "hex". governance fields are manual and must be sourced.
# hn_query: Algolia HN story search used for mention trends.

[[language]]
name = "Crystal"
repos = [
  { host = "github", repo = "crystal-lang/crystal" },
  { host = "codeberg", repo = "crystal-lang/crystal" },
]
subreddit = "crystal_programming"
forum = { kind = "discourse", url = "https://forum.crystal-lang.org" }
discord_invite = "YS7YvQy"
other_platforms = ["X"]
x_accounts = ["CrystalLanguage"]
zed = ["crystal"]
vscode = ["crystal-lang-tools.crystal-lang"]
openvsx = ["crystal-lang-tools.crystal-lang"]
lsp = { name = "Crystalline", repo = "elbywan/crystalline" }
lsp_rating = 2
lsp_notes = "Stable Zed plugin is not full featured; the development one needs careful installation and is buggy."

hn_query = "Crystal programming OR Crystal-lang OR \"Crystal language\""

